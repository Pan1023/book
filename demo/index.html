<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邮件中心 MailHub · 演示 Demo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-layout">
    <!-- ============ 侧边栏 ============ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand-logo">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">邮件中心</div>
          <div class="brand-sub">MailHub Demo</div>
        </div>
      </div>

      <nav class="sidebar__nav" id="navMenu">
        <div class="nav-group">
          <div class="nav-group__title">概览</div>
          <a class="nav-item" data-route="dashboard" href="#/dashboard">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
            <span>数据看板</span>
          </a>
        </div>

        <div class="nav-group">
          <div class="nav-group__title">普邮管理</div>
          <a class="nav-item" data-route="inbox" href="#/inbox">
            <svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
            <span>统一收件箱</span>
            <em class="nav-badge" id="inboxBadge">3</em>
          </a>
          <a class="nav-item" data-route="contacts" href="#/contacts">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>联系人会话</span>
          </a>
          <a class="nav-item" data-route="accounts" href="#/accounts">
            <svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>邮箱账号绑定</span>
          </a>
        </div>

        <div class="nav-group">
          <div class="nav-group__title">邮件营销</div>
          <a class="nav-item" data-route="campaigns" href="#/campaigns">
            <svg viewBox="0 0 24 24"><path d="M3 11l18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
            <span>邮件任务</span>
          </a>
          <a class="nav-item" data-route="campaign-new" href="#/campaigns/new">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>创建邮件任务</span>
          </a>
          <a class="nav-item" data-route="analytics" href="#/analytics">
            <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>数据分析</span>
          </a>
        </div>

        <div class="nav-group">
          <div class="nav-group__title">客户</div>
          <a class="nav-item" data-route="leads" href="#/leads">
            <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <span>意向客户</span>
            <em class="nav-badge nav-badge--gold" id="leadsBadge">5</em>
          </a>
        </div>
      </nav>

      <div class="sidebar__footer">
        <button class="btn btn--primary btn--block" id="quickComposeBtn">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          写邮件
        </button>
      </div>
    </aside>

    <!-- ============ 主区域 ============ -->
    <div class="main">
      <header class="topbar">
        <button class="topbar__menu" id="menuToggle" aria-label="菜单">
          <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar__search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="globalSearch" placeholder="搜索邮件、联系人、任务…" />
        </div>
        <div class="topbar__right">
          <div class="topbar__select" id="accountSelect">
            <button class="ts-btn" id="accountSelectBtn">
              <span class="dot dot--green"></span>
              <span id="currentAccountLabel">全部邮箱</span>
              <svg viewBox="0 0 24 24" width="14" height="14"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="ts-menu" id="accountSelectMenu"></div>
          </div>
          <div class="topbar__bell" id="bellWrap">
            <button class="icon-btn" id="bellBtn" aria-label="通知">
              <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <em class="bell-dot"></em>
            </button>
            <div class="bell-panel" id="bellPanel"></div>
          </div>
          <div class="topbar__user">
            <div class="avatar avatar--indigo">张</div>
            <div class="user-meta">
              <div class="user-name">张伟</div>
              <div class="user-role">销售经理</div>
            </div>
          </div>
        </div>
      </header>

      <main class="content" id="view"><!-- 视图渲染区 --></main>
    </div>
  </div>

  <!-- 弹窗 / Toast 容器 -->
  <div id="modalRoot"></div>
  <div class="toast-stack" id="toastStack"></div>

  <!-- ============ 脚本 ============ -->
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/inbox.js"></script>
  <script src="js/views/contacts.js"></script>
  <script src="js/views/accounts.js"></script>
  <script src="js/views/campaigns.js"></script>
  <script src="js/views/campaign-detail.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/leads.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
